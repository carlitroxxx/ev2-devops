services:
  mysql:
    image: mysql:8.0
    container_name: mysql-despacho
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: despacho_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red-despacho

  backend-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: backend-despachos
    restart: always
    depends_on:
      - mysql
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: despacho_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8081:8081"
    networks:
      - red-despacho

  backend-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
    container_name: backend-ventas
    restart: always
    depends_on:
      - mysql
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: despacho_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8082:8082"
    networks:
      - red-despacho

  frontend:
    build:
      context: ./front_despacho
    container_name: frontend-despacho
    restart: always
    depends_on:
      - backend-despachos
      - backend-ventas
    ports:
      - "8080:80"
    networks:
      - red-despacho

volumes:
  mysql_data:

networks:
  red-despacho:
    driver: bridge